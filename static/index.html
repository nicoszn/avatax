<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Avatax</title>
  <link rel="stylesheet" href="/static/style.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚡</text></svg>" />
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body x-data x-init="$store.forge">
  <div class="container">

    <section class="hero">
      <h1>⚡Avatax</h1>
      <p>Download video, audio & images from 30+ platforms</p>
    </section>

    <!-- Tabs -->
    <div class="tabs">
      <button class="tab-btn" :class="{ active: $store.forge.activeTab === 'single' }" @click="$store.forge.activeTab = 'single'; $store.forge.error = null">Single</button>
      <button class="tab-btn" :class="{ active: $store.forge.activeTab === 'batch' }" @click="$store.forge.activeTab = 'batch'; $store.forge.error = null">Batch</button>
      <button class="tab-btn" :class="{ active: $store.forge.activeTab === 'playlist' }" @click="$store.forge.activeTab = 'playlist'; $store.forge.error = null">Playlist</button>
    </div>

    <!-- Single URL -->
    <div x-show="$store.forge.activeTab === 'single'">
      <div class="url-input-group">
        <input type="text" x-model="$store.forge.url" @input.debounce.300ms="$store.forge.detectPlatform()" @keydown.enter="$store.forge.submit()" placeholder="Paste any media URL…" />
        <button class="btn-extract" @click="$store.forge.submit()" :disabled="$store.forge.loading || !$store.forge.url.trim()">
          <span class="spinner" x-show="$store.forge.loading"></span>
          <span x-text="$store.forge.loading ? 'Extracting…' : 'Extract'"></span>
        </button>
      </div>
    </div>

    <!-- Batch -->
    <div class="batch-input" :class="{ active: $store.forge.activeTab === 'batch' }">
      <textarea class="batch-textarea" x-model="$store.forge.batchUrls" placeholder="One URL per line (max 20)…"></textarea>
      <button class="btn-extract" style="margin-top:8px" @click="$store.forge.submit()" :disabled="$store.forge.loading || !$store.forge.batchUrls.trim()">
        <span class="spinner" x-show="$store.forge.loading"></span>
        <span x-text="$store.forge.loading ? 'Extracting…' : 'Extract All'"></span>
      </button>
    </div>

    <!-- Playlist -->
    <div class="batch-input" :class="{ active: $store.forge.activeTab === 'playlist' }">
      <div class="url-input-group">
        <input type="text" x-model="$store.forge.url" @keydown.enter="$store.forge.submit()" placeholder="Paste playlist URL…" />
        <button class="btn-extract" @click="$store.forge.submit()" :disabled="$store.forge.loading || !$store.forge.url.trim()">
          <span class="spinner" x-show="$store.forge.loading"></span>
          <span x-text="$store.forge.loading ? 'Loading…' : 'Extract Playlist'"></span>
        </button>
      </div>
    </div>

    <!-- Options -->
    <div class="options-row">
      <div class="select-wrap">
        <select x-model="$store.forge.quality">
          <option value="best">🏆 Best</option>
          <option value="good">👍 720p</option>
          <option value="worst">💾 Smallest</option>
          <option value="audio_only">🎵 Audio</option>
        </select>
      </div>
      <div class="select-wrap">
        <select x-model="$store.forge.mediaType">
          <option value="all">All</option>
          <option value="video">Video</option>
          <option value="audio">Audio</option>
          <option value="image">Images</option>
        </select>
      </div>
      <label class="compress-toggle"
             :class="{ on: $store.forge.compressionActive(), disabled: $store.forge.quality === 'audio_only' }"
             :title="$store.forge.quality === 'audio_only' ? 'Not available for audio-only downloads' : 'Re-encode downloads with FFmpeg to a smaller file'">
        <input type="checkbox" x-model="$store.forge.compress" :disabled="$store.forge.quality === 'audio_only'" />
        <span class="switch"></span>
        <span>🗜 Compress</span>
      </label>
      <div class="select-wrap" x-show="$store.forge.compressionActive()" x-transition.opacity>
        <select x-model="$store.forge.compressionPreset" aria-label="Compression preset">
          <option value="light">🪶 Light</option>
          <option value="balanced">⚖️ Balanced</option>
          <option value="aggressive">🔬 Aggressive</option>
        </select>
      </div>
      <template x-if="$store.forge.detectedPlatform">
        <span class="platform-tag" x-text="$store.forge.platformEmoji($store.forge.detectedPlatform) + ' ' + $store.forge.detectedPlatform"></span>
      </template>
    </div>

    <!-- Error -->
    <template x-if="$store.forge.error">
      <div class="status-bar error" x-text="$store.forge.error"></div>
    </template>

    <!-- Loading -->
    <template x-if="$store.forge.loading && !$store.forge.result && !$store.forge.batchResults && !$store.forge.playlistResult">
      <div style="height:120px;background:var(--bg-input);border-radius:12px;animation:fadeUp 0.3s"></div>
    </template>

    <!-- Single Result -->
    <template x-if="$store.forge.result && !$store.forge.error">
      <div class="result-card">
        <div class="result-header">
          <img class="result-thumbnail" :src="$store.forge.result.media.thumbnail || ''" :alt="$store.forge.result.media.title" @error="$event.target.style.display='none'" />
          <div class="result-meta">
            <h3 x-text="$store.forge.result.media.title || 'Untitled'"></h3>
            <div class="uploader" x-text="$store.forge.result.media.uploader || $store.forge.result.media.channel || ''"></div>
            <div class="meta-row">
              <span class="meta-tag" x-text="$store.forge.platformEmoji($store.forge.result.media.platform) + ' ' + $store.forge.result.media.platform"></span>
              <template x-if="$store.forge.result.media.duration_string">
                <span class="meta-tag" x-text="'⏱ ' + $store.forge.result.media.duration_string"></span>
              </template>
              <template x-if="$store.forge.result.media.view_count != null">
                <span class="meta-tag" x-text="$store.forge.formatNumber($store.forge.result.media.view_count) + ' views'"></span>
              </template>
            </div>
          </div>
        </div>

        <!-- Download -->
        <div class="download-section">
          <template x-if="$store.forge.compressionActive()">
            <span class="meta-tag">🗜 FFmpeg · <span x-text="$store.forge.compressionPreset"></span></span>
          </template>
          <template x-if="$store.forge.result.media.webpage_url || $store.forge.result.media.original_url">
            <a class="btn-download primary" :href="$store.forge.dlUrl($store.forge.result.media.webpage_url || $store.forge.result.media.original_url, $store.forge.quality)">
              <span x-text="$store.forge.compressionActive() ? '⬇ Download (🗜 compressed)' : '⬇ Download'"></span>
            </a>
          </template>
          <template x-if="$store.forge.result.media.webpage_url">
            <a class="btn-download secondary" :href="$store.forge.result.media.webpage_url" target="_blank">🔗 Original</a>
          </template>
          <template x-if="$store.forge.result.download_url">
            <button class="btn-download success" @click="$store.forge.copyUrl($store.forge.result.download_url)">📋 Copy URL</button>
          </template>
        </div>

        <!-- Formats -->
        <div class="formats-section" x-show="$store.forge.result.media.formats && $store.forge.result.media.formats.length > 0">
          <button class="formats-toggle" @click="$store.forge.showFormats = !$store.forge.showFormats">
            <span class="arrow" :class="{ open: $store.forge.showFormats }">▶</span>
            <span x-text="'Available formats (' + ($store.forge.result.media.formats ? $store.forge.result.media.formats.length : 0) + ')'"></span>
          </button>
          <template x-if="$store.forge.showFormats">
            <div class="format-list">
              <template x-for="f in $store.forge.result.media.formats.slice().reverse()" :key="f.format_id">
                <div class="format-item">
                  <div class="format-info">
                    <div class="res" x-text="f.resolution || (f.width ? f.width + 'x' + f.height : f.ext)"></div>
                    <div class="meta" x-text="(f.format_id || '') + ' · ' + (f.ext || '') + ($store.forge.formatBitrate(f.tbr || f.abr) ? ' · ' + $store.forge.formatBitrate(f.tbr || f.abr) : '') + ($store.forge.formatSize(f.filesize) ? ' · ' + $store.forge.formatSize(f.filesize) : '')"></div>
                  </div>
                  <a class="format-dl" :href="$store.forge.dlUrl($store.forge.result.media.webpage_url || $store.forge.result.media.original_url, 'custom', f.format_id)">⬇</a>
                </div>
              </template>
            </div>
          </template>
        </div>
      </div>
    </template>

    <!-- Playlist -->
    <template x-if="$store.forge.playlistResult && !$store.forge.error">
      <div class="result-card">
        <div class="result-header" style="border-bottom:none">
          <div class="result-meta">
            <h3 x-text="$store.forge.playlistResult.title || 'Playlist'"></h3>
            <div class="meta-row" style="margin-top:6px">
              <template x-if="$store.forge.playlistResult.uploader">
                <span class="meta-tag" x-text="'👤 ' + $store.forge.playlistResult.uploader"></span>
              </template>
              <span class="meta-tag" x-text="$store.forge.playlistResult.playlist_count + ' items'"></span>
            </div>
          </div>
        </div>
        <div class="playlist-items">
          <template x-for="item in $store.forge.playlistResult.items" :key="item.id || item.index">
            <div class="playlist-item" @click="$store.forge.url = item.url; $store.forge.activeTab = 'single'; $store.forge.extract()">
              <span class="idx" x-text="item.index"></span>
              <span class="title" x-text="item.title || item.id"></span>
              <span class="duration" x-text="$store.forge.formatDuration(item.duration)"></span>
            </div>
          </template>
        </div>
      </div>
    </template>

    <!-- Batch -->
    <template x-if="$store.forge.batchResults && !$store.forge.error">
      <div>
        <div class="status-bar" :class="$store.forge.batchResults.failed > 0 ? 'error' : 'success'" x-text="$store.forge.batchResults.successful + ' OK · ' + $store.forge.batchResults.failed + ' failed'"></div>
        <template x-for="(r, i) in $store.forge.batchResults.results" :key="i">
          <div class="batch-item">
            <div class="batch-item-header">
              <span x-text="(r.media?.webpage_url || '').substring(0, 60)"></span>
              <span x-text="r.success ? '✅' : '❌'"></span>
            </div>
            <div class="batch-item-body" x-show="r.success">
              <div class="title" x-text="r.media?.title || 'Untitled'"></div>
              <template x-if="r.media?.webpage_url">
                <a class="download-url" :href="$store.forge.dlUrl(r.media?.webpage_url, 'best')">⬇ Download</a>
              </template>
            </div>
            <div class="batch-item-body" x-show="!r.success">
              <div style="color:var(--danger);font-size:0.82rem" x-text="r.message || 'Failed'"></div>
            </div>
          </div>
        </template>
      </div>
    </template>

    <!-- Empty -->
    <template x-if="!$store.forge.loading && !$store.forge.result && !$store.forge.batchResults && !$store.forge.playlistResult && !$store.forge.error">
      <div class="empty-state">
        <div class="icon">⚡</div>
        <h3>Paste a URL to get started</h3>
        <p>YouTube, Twitter, Instagram, TikTok, Reddit, Pornhub & more</p>
      </div>
    </template>

    <footer class="footer">
      <p>Avatax · Built with <a href="https://github.com/yt-dlp/yt-dlp" target="_blank">yt-dlp</a> + FastAPI</p>
    </footer>
  </div>
  <script src="/static/app.js"></script>
</body>
</html>
